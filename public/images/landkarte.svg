<svg viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="mapGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c7d2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Base rectangle -->
  <rect width="300" height="240" fill="url(#mapGradient)"/>
  
  <!-- Water/Paths -->
  <path d="M 30 80 Q 100 70 150 90 T 270 60" stroke="url(#waterGradient)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 20 150 Q 80 140 130 165 Q 180 190 260 140" stroke="url(#waterGradient)" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <!-- Grid lines (map reference) -->
  <line x1="50" y1="30" x2="50" y2="210" stroke="#c4b5fd" stroke-width="1" opacity="0.4"/>
  <line x1="100" y1="30" x2="100" y2="210" stroke="#c4b5fd" stroke-width="1" opacity="0.4"/>
  <line x1="150" y1="30" x2="150" y2="210" stroke="#c4b5fd" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="30" x2="200" y2="210" stroke="#c4b5fd" stroke-width="1" opacity="0.4"/>
  <line x1="250" y1="30" x2="250" y2="210" stroke="#c4b5fd" stroke-width="1" opacity="0.4"/>
  
  <line x1="20" y1="60" x2="280" y2="60" stroke="#c4b5fd" stroke-width="1" opacity="0.4"/>
  <line x1="20" y1="110" x2="280" y2="110" stroke="#c4b5fd" stroke-width="1" opacity="0.4"/>
  <line x1="20" y1="160" x2="280" y2="160" stroke="#c4b5fd" stroke-width="1" opacity="0.4"/>
  <line x1="20" y1="200" x2="280" y2="200" stroke="#c4b5fd" stroke-width="1" opacity="0.4"/>
  
  <!-- POI Markers -->
  <!-- Marker 1 - Top left -->
  <circle cx="70" cy="60" r="8" fill="#ec4899" opacity="0.8"/>
  <circle cx="70" cy="60" r="5" fill="#ff69b4" opacity="0.9"/>
  <circle cx="70" cy="60" r="2" fill="white"/>
  
  <!-- Marker 2 - Center -->
  <circle cx="150" cy="100" r="8" fill="#f43f5e" opacity="0.8"/>
  <circle cx="150" cy="100" r="5" fill="#ff6b9d" opacity="0.9"/>
  <circle cx="150" cy="100" r="2" fill="white"/>
  
  <!-- Marker 3 - Right -->
  <circle cx="240" cy="75" r="8" fill="#ec4899" opacity="0.8"/>
  <circle cx="240" cy="75" r="5" fill="#ff69b4" opacity="0.9"/>
  <circle cx="240" cy="75" r="2" fill="white"/>
  
  <!-- Marker 4 - Bottom left -->
  <circle cx="85" cy="170" r="8" fill="#f43f5e" opacity="0.8"/>
  <circle cx="85" cy="170" r="5" fill="#ff6b9d" opacity="0.9"/>
  <circle cx="85" cy="170" r="2" fill="white"/>
  
  <!-- Marker 5 - Bottom center -->
  <circle cx="180" cy="185" r="8" fill="#ec4899" opacity="0.8"/>
  <circle cx="180" cy="185" r="5" fill="#ff69b4" opacity="0.9"/>
  <circle cx="180" cy="185" r="2" fill="white"/>
  
  <!-- Marker 6 - Bottom right -->
  <circle cx="250" cy="160" r="8" fill="#f43f5e" opacity="0.8"/>
  <circle cx="250" cy="160" r="5" fill="#ff6b9d" opacity="0.9"/>
  <circle cx="250" cy="160" r="2" fill="white"/>
  
  <!-- Border -->
  <rect width="300" height="240" fill="none" stroke="#a78bfa" stroke-width="2"/>
</svg>