<svg viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="webGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ddd6fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Base -->
  <rect width="300" height="240" fill="url(#webGradient)"/>
  
  <!-- Browser window -->
  <rect x="20" y="20" width="260" height="200" rx="12" fill="white" stroke="#a78bfa" stroke-width="2"/>
  
  <!-- Browser header -->
  <rect x="20" y="20" width="260" height="35" rx="12" fill="#f3e8ff" stroke="#a78bfa" stroke-width="2"/>
  
  <!-- Browser buttons -->
  <circle cx="35" cy="37" r="4" fill="#ec4899"/>
  <circle cx="50" cy="37" r="4" fill="#f59e0b"/>
  <circle cx="65" cy="37" r="4" fill="#10b981"/>
  
  <!-- URL bar -->
  <rect x="85" y="30" width="180" height="14" rx="7" fill="#e0e7ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="95" y="38" font-size="10" fill="#7c3aed">portfolio.dev</text>
  
  <!-- Header section -->
  <rect x="25" y="65" width="250" height="30" rx="8" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="160" y="85" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">JAUDELLE</text>
  
  <!-- Main content area -->
  <rect x="25" y="105" width="250" height="85" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  
  <!-- Content blocks -->
  <rect x="35" y="115" width="230" height="10" rx="4" fill="#ddd6fe"/>
  <rect x="35" y="130" width="230" height="10" rx="4" fill="#e9d5ff"/>
  <rect x="35" y="145" width="150" height="10" rx="4" fill="#ddd6fe"/>
  
  <!-- Buttons -->
  <rect x="35" y="165" width="50" height="15" rx="7" fill="#7c3aed"/>
  <rect x="90" y="165" width="50" height="15" rx="7" fill="#ec4899" opacity="0.6"/>
  
  <!-- Footer -->
  <rect x="25" y="200" width="250" height="15" rx="6" fill="#e9d5ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="160" y="209" font-size="9" fill="#a78bfa" text-anchor="middle">© 2026</text>
</svg>