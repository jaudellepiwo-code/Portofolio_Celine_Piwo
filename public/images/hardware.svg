<svg viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="hardwareGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fef2f2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Base -->
  <rect width="300" height="240" fill="url(#hardwareGradient)"/>
  
  <!-- Logic circuit board -->
  <!-- Grid background -->
  <g opacity="0.2">
    <line x1="30" y1="30" x2="30" y2="210" stroke="#7c3aed" stroke-width="1"/>
    <line x1="80" y1="30" x2="80" y2="210" stroke="#7c3aed" stroke-width="1"/>
    <line x1="130" y1="30" x2="130" y2="210" stroke="#7c3aed" stroke-width="1"/>
    <line x1="180" y1="30" x2="180" y2="210" stroke="#7c3aed" stroke-width="1"/>
    <line x1="230" y1="30" x2="230" y2="210" stroke="#7c3aed" stroke-width="1"/>
    <line x1="280" y1="30" x2="280" y2="210" stroke="#7c3aed" stroke-width="1"/>
    
    <line x1="10" y1="60" x2="290" y2="60" stroke="#7c3aed" stroke-width="1"/>
    <line x1="10" y1="105" x2="290" y2="105" stroke="#7c3aed" stroke-width="1"/>
    <line x1="10" y1="150" x2="290" y2="150" stroke="#7c3aed" stroke-width="1"/>
    <line x1="10" y1="195" x2="290" y2="195" stroke="#7c3aed" stroke-width="1"/>
  </g>
  
  <!-- AND Gate -->
  <g>
    <!-- Inputs -->
    <line x1="40" y1="55" x2="60" y2="55" stroke="#7c3aed" stroke-width="2"/>
    <line x1="40" y1="75" x2="60" y2="75" stroke="#7c3aed" stroke-width="2"/>
    <!-- Gate shape -->
    <rect x="60" y="45" width="35" height="45" rx="5" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
    <text x="75" y="68" font-size="12" font-weight="bold" fill="white" text-anchor="middle">AND</text>
    <!-- Output -->
    <line x="95" y="67" x2="115" y2="67" stroke="#7c3aed" stroke-width="2"/>
  </g>
  
  <!-- OR Gate -->
  <g>
    <!-- Inputs -->
    <line x1="180" y1="55" x2="200" y2="55" stroke="#7c3aed" stroke-width="2"/>
    <line x1="180" y1="75" x2="200" y2="75" stroke="#7c3aed" stroke-width="2"/>
    <!-- Gate shape -->
    <path d="M 200 45 Q 215 45 230 65 Q 215 85 200 85 Z" fill="#ec4899" stroke="#7c3aed" stroke-width="2"/>
    <text x="212" y="68" font-size="11" font-weight="bold" fill="white" text-anchor="middle">OR</text>
    <!-- Output -->
    <line x="230" y="65" x2="250" y2="65" stroke="#7c3aed" stroke-width="2"/>
  </g>
  
  <!-- NOT Gate -->
  <g>
    <!-- Input -->
    <line x1="40" y1="135" x2="60" y2="135" stroke="#7c3aed" stroke-width="2"/>
    <!-- Gate shape -->
    <polygon points="60,120 60,150 80,135" fill="#f43f5e" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="85" cy="135" r="4" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <!-- Output -->
    <line x="89" y="135" x2="110" y2="135" stroke="#7c3aed" stroke-width="2"/>
  </g>
  
  <!-- XOR Gate -->
  <g>
    <!-- Inputs -->
    <line x1="180" y1="130" x2="200" y2="130" stroke="#7c3aed" stroke-width="2"/>
    <line x1="180" y1="150" x2="200" y2="150" stroke="#7c3aed" stroke-width="2"/>
    <!-- Gate shape -->
    <path d="M 205 120 Q 220 120 230 140 Q 220 160 205 160 Q 207 160 210 140 Q 207 120 205 120 Z" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2"/>
    <text x="215" y="143" font-size="10" font-weight="bold" fill="white" text-anchor="middle">XOR</text>
    <!-- Output -->
    <line x="230" y="140" x2="250" y2="140" stroke="#7c3aed" stroke-width="2"/>
  </g>
  
  <!-- Output LEDs -->
  <circle cx="115" cy="67" r="5" fill="#10b981" opacity="0.7"/>
  <circle cx="110" cy="135" r="5" fill="#f59e0b" opacity="0.7"/>
  <circle cx="250" cy="65" r="5" fill="#f43f5e" opacity="0.7"/>
  <circle cx="250" cy="140" r="5" fill="#7c3aed" opacity="0.7"/>
  
  <!-- Power indicator -->
  <rect x="260" y="190" width="20" height="15" rx="3" fill="#10b981" opacity="0.8"/>
  <text x="270" y="200" font-size="9" fill="white" text-anchor="middle" font-weight="bold">PWR</text>
</svg>